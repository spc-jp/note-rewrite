<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Rewrite & Sales Supporter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

      font-size: 1.25rem;

</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <div class="sticky top-0 z-40 bg-slate-50/90 backdrop-blur-md border-b border-slate-200 pb-4 pt-4 px-6 mb-8 shadow-sm">
    <div class="max-w-4xl mx-auto relative">
      <div class="text-center space-y-2">
        <span class="inline-block px-3 py-1 bg-teal-100 text-teal-800 text-xs font-bold tracking-wider rounded-full uppercase">Sales Edition</span>
        <h1 class="text-2xl md:text-3xl font-bold text-teal-700">Note Rewrite &amp; Sales Supporter</h1>
        <p class="text-slate-500 text-sm hidden sm:block">過去のnote記事をフックにして、ご自身の商品やアプリを自然に販売するための記事をAIが生成します。</p>
      </div>
      <a href="https://note.com/_yoshibon" target="_blank" rel="noopener noreferrer"

        noteを見る

  <div class="max-w-4xl mx-auto px-4 sm:px-6 space-y-6" id="inputArea">

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-100/50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span>
          基本情報を入力
        </h2>
      </div>
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">元のnote記事URL <span class="text-red-500">*</span></label>
          <input id="noteUrl" type="url" placeholder="https://note.com/..." class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">販売する商品・アプリの名前 <span class="text-red-500">*</span></label>
          <input id="appName" type="text" placeholder="例：経営みっけ PRO" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-slate-50">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1.5">コンセプト・特徴 <span class="text-red-500">*</span></label>
          <textarea id="appConcept" rows="3" placeholder="例：税理士事務所が顧問先の経営状況をAIで即診断できる、シンプルな無料ツール" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-slate-50 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">商品・アプリのURL（任意）</label>
            <input id="appUrl" type="url" placeholder="https://..." class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-slate-50">
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1.5">購入リンク・StripeURL（任意）</label>
            <input id="stripeUrl" type="url" placeholder="https://buy.stripe.com/..." class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-400 bg-slate-50">
          </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-100/50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">2</span>
          記事の目的とトーンを選択
        </h2>
      </div>
      <div class="p-6 space-y-6">
        <div>
          <p class="text-sm font-bold text-slate-700 mb-3">記事の目的</p>
          <div class="flex flex-wrap gap-2">
            <button onclick="selectGoal(this)" data-val="信頼構築" class="goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-teal-500 bg-teal-50 text-teal-700">信頼構築</button>
            <button onclick="selectGoal(this)" data-val="集客問合せ" class="goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">集客問合せ</button>
            <button onclick="selectGoal(this)" data-val="使い方紹介" class="goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">使い方紹介</button>
            <button onclick="selectGoal(this)" data-val="開発背景" class="goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">開発背景</button>
            <button onclick="selectGoal(this)" data-val="クスッと笑える" class="goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">クスッと笑える</button>
          </div>
        </div>
        <div>
          <p class="text-sm font-bold text-slate-700 mb-3">文章のトーン</p>
          <div class="flex flex-wrap gap-2">
            <button onclick="selectTone(this)" data-val="語りかけ" class="tone-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-teal-500 bg-teal-50 text-teal-700">語りかけ</button>
            <button onclick="selectTone(this)" data-val="ストーリー実話" class="tone-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">ストーリー実話</button>
            <button onclick="selectTone(this)" data-val="解説風" class="tone-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600">解説風</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="bg-slate-100/50 px-6 py-4 border-b border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
          <span class="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">3</span>
          出力する「構成パターン」を選択（複数可）
        </h2>
      </div>
      <div class="p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer border-teal-500 bg-teal-50/50">
            <input type="checkbox" id="pat_empathy" checked class="w-5 h-5 mt-0.5" style="accent-color:#0d9488">
            <div><div class="font-bold text-slate-800">共感風（体験談）</div><p class="text-sm text-slate-500 mt-1">過去の悩みや経験から、アプリ開発の理由を語り、共感を通じて販売へ繋げます。</p></div>
          </label>
          <label class="flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer border-slate-100 bg-white">
            <input type="checkbox" id="pat_knowhow" class="w-5 h-5 mt-0.5" style="accent-color:#0d9488">
            <div><div class="font-bold text-slate-800">ノウハウ風（価値提供）</div><p class="text-sm text-slate-500 mt-1">役立つ3つの考え方を提供した上で、解決策としてアプリを優しく提案します。</p></div>
          </label>
          <label class="flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer border-slate-100 bg-white">
            <input type="checkbox" id="pat_question" class="w-5 h-5 mt-0.5" style="accent-color:#0d9488">
            <div><div class="font-bold text-slate-800">問いかけ風（課題解決）</div><p class="text-sm text-slate-500 mt-1">読者の悩みに問いかけ、今のやり方を変える選択肢としてアプリを案内します。</p></div>
          </label>
          <label class="flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer border-slate-100 bg-white">
            <input type="checkbox" id="pat_partner" class="w-5 h-5 mt-0.5" style="accent-color:#0d9488">
            <div><div class="font-bold text-slate-800">パートナー募集風</div><p class="text-sm text-slate-500 mt-1">同じ想いを持つ方を募る形で、初期ユーザーや購入者へ温かく呼びかけます。</p></div>
          </label>
        </div>

        <div id="errorMsg" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm font-medium"></div>

        <button onclick="handleGenerate()"
          class="w-full mt-8 bg-teal-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-teal-700 transition-colors text-lg">
          ✨ AIがセールス記事を一括生成する
        </button>
      </div>
    </div>
  </div>

  <div id="loadingArea" class="hidden max-w-4xl mx-auto px-4 py-20 text-center text-teal-600">
    <div class="w-12 h-12 border-4 border-teal-200 border-t-teal-600 rounded-full animate-spin mx-auto mb-4"></div>
    <p class="font-bold text-lg">Claudeが執筆しています...</p>
    <p class="text-sm text-slate-500 mt-2">30〜60秒ほどお待ちください。</p>
  </div>

  <div id="resultArea" class="hidden max-w-4xl mx-auto px-4 sm:px-6 space-y-8 pt-4">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-slate-800">✅ セールス記事の生成が完了しました！</h2>
      <p id="resultMeta" class="text-slate-500 mt-2"></p>
    </div>

    <div id="resultCards" class="space-y-8"></div>
    <div id="snsArea" class="mt-12 pt-10 border-t-2 border-slate-200 space-y-10"></div>

    <div class="bg-teal-50 border border-teal-100 rounded-2xl p-6 text-center shadow-sm">
      <h3 class="text-lg font-bold text-teal-900 mb-2">すべての準備が整いました！</h3>
      <p class="text-sm text-teal-700 mb-6">記事・SNS投稿テンプレ・Midjourneyプロンプトをまとめてコピーできます。</p>
      <button onclick="copyAll()" class="bg-slate-800 text-white px-8 py-4 rounded-xl text-base font-bold hover:bg-slate-900 transition-colors shadow-md">
        📋 全て一括でコピーする（記事・SNS・画像P）
      </button>
    </div>

    <div class="flex justify-center pt-6 pb-10">
      <button onclick="handleReset()" class="px-8 py-3 bg-white text-slate-600 font-bold border-2 border-slate-200 rounded-xl hover:border-teal-200 hover:text-teal-600 transition-all shadow-sm">
        条件入力画面に戻る
      </button>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://note-rewrite.yymmatsu.workers.dev';
    var currentGoal = '信頼構築';
    var currentTone = '語りかけ';
    var allCopyText = '';

    function selectGoal(btn) {
      document.querySelectorAll('.goal-btn').forEach(function(b) {
        b.className = 'goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600';
      });
      btn.className = 'goal-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-teal-500 bg-teal-50 text-teal-700';
      currentGoal = btn.dataset.val;
    }

    function selectTone(btn) {
      document.querySelectorAll('.tone-btn').forEach(function(b) {
        b.className = 'tone-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-slate-200 bg-white text-slate-600';
      });
      btn.className = 'tone-btn px-4 py-2 rounded-xl border-2 text-sm font-bold border-teal-500 bg-teal-50 text-teal-700';
      currentTone = btn.dataset.val;
    }

    function showToast(message, isError) {
      var toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;padding:16px 24px;border-radius:12px;z-index:9999;font-size:14px;font-weight:bold;color:white;background:' + (isError ? '#dc2626' : '#1e293b');
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(function() { if (document.body.contains(toast)) document.body.removeChild(toast); }, 3000);
    }

    function copyText(text, msg) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand('copy');
        showToast(msg || 'コピーしました！', false);
      } catch(e) {
        showToast('コピーに失敗しました', true);
      }
      document.body.removeChild(ta);
    }

    function copyAll() {
      copyText(allCopyText, '全てコピーしました！');
    }

    function handleReset() {
      document.getElementById('inputArea').classList.remove('hidden');
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('loadingArea').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // markdownをHTMLに変換（## ### p ハッシュタグ対応）
    function markdownToHtml(text) {
      var lines = text.split('\n');
      var html = '';
      var inHashtag = false;

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i];

        // ハッシュタグ行の検出（#で始まる単語が並ぶ行）
        if (/^(#[^\s#]+\s*)+$/.test(line.trim())) {
          html += '<div class="hashtags">' + line.trim() + '</div>';
          continue;
        }

        if (line.startsWith('## ')) {
          html += '<h2>' + line.replace('## ', '') + '</h2>';
        } else if (line.startsWith('### ')) {
          html += '<h3>' + line.replace('### ', '') + '</h3>';
        } else if (line.trim() === '') {
          // 空行はスキップ
        } else {
          html += '<p>' + line + '</p>';
        }
      }
      return html;
    }

    async function handleGenerate() {
      var noteUrl = document.getElementById('noteUrl').value.trim();
      var appName = document.getElementById('appName').value.trim();
      var appConcept = document.getElementById('appConcept').value.trim();
      var appUrl = document.getElementById('appUrl').value.trim();
      var stripeUrl = document.getElementById('stripeUrl').value.trim();

      if (!noteUrl || !appName || !appConcept) {
        alert('「元のnote記事URL」「商品/アプリの名前」「コンセプト」は必須です。');
        return;
      }

      var patterns = {
        empathy: document.getElementById('pat_empathy').checked,
        knowhow: document.getElementById('pat_knowhow').checked,
        question: document.getElementById('pat_question').checked,
        partner: document.getElementById('pat_partner').checked,
      };

      if (!patterns.empathy && !patterns.knowhow && !patterns.question && !patterns.partner) {
        alert('パターンを1つ以上選択してください。');
        return;
      }

      document.getElementById('inputArea').classList.add('hidden');
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('loadingArea').classList.remove('hidden');

      try {
        var res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            noteUrl: noteUrl, appName: appName, appUrl: appUrl,
            stripeUrl: stripeUrl, appConcept: appConcept,
            articleGoal: currentGoal, articleTone: currentTone,
            patterns: patterns
          }),
        });

        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();

        document.getElementById('loadingArea').classList.add('hidden');
        document.getElementById('resultMeta').textContent = '「' + currentGoal + '」の目的で、「' + currentTone + '」トーンをベースに作成しました。';

        var keyMap = {
          empathy: '共感風（体験談から自然に誘導）',
          knowhow: 'ノウハウ風（お役立ち情報から誘導）',
          question: '問いかけ風（悩みに寄り添い誘導）',
          partner: 'パートナー募集風（想いを共有して誘導）',
        };

        var cards = document.getElementById('resultCards');
        cards.innerHTML = '';
        var articleText = '■ 基本情報\n・元記事URL：' + noteUrl + '\n・アプリ名：' + appName + '\n・目的：' + currentGoal + '\n・トーン：' + currentTone + '\n\n━━━━━━━━━━━━━━━━━━━━\n\n';

        var keys = ['empathy', 'knowhow', 'question', 'partner'];
        for (var i = 0; i < keys.length; i++) {
          var key = keys[i];
          if (!data[key]) continue;
          var r = data[key];
          var fullText = r.title + '\n\n' + r.content;
          articleText += '■ 【' + (keyMap[key] || key) + '】\nタイトル：' + r.title + '\n\n' + r.content + '\n\n━━━━━━━━━━━━━━━━━━━━\n\n';

          var card = document.createElement('div');
          card.className = 'bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden';

          var header = document.createElement('div');
          header.className = 'bg-teal-50 px-5 py-4 border-b border-teal-100 flex justify-between items-center';
          header.innerHTML = '<span class="font-bold text-teal-900">' + (keyMap[key] || key) + '</span>';

          var copyBtn = document.createElement('button');
          copyBtn.className = 'text-teal-700 text-sm font-bold px-3 py-1.5 bg-white border border-teal-200 rounded-lg hover:bg-teal-50';
          copyBtn.textContent = '📋 この記事をコピー';
          (function(t) {
            copyBtn.addEventListener('click', function() { copyText(t, '記事をコピーしました！'); });
          })(fullText);
          header.appendChild(copyBtn);

          var body = document.createElement('div');
          body.className = 'p-6';

          // タイトル表示
          var titleEl = document.createElement('h3');
          titleEl.className = 'text-xl font-bold text-slate-800 mb-6 pb-4 border-b border-slate-200';
          titleEl.textContent = r.title;
          body.appendChild(titleEl);

          // 本文（markdown変換して表示）
          var articleDiv = document.createElement('div');
          articleDiv.className = 'article-body max-h-[600px] overflow-y-auto pr-2';
          articleDiv.innerHTML = markdownToHtml(r.content);
          body.appendChild(articleDiv);

          card.appendChild(header);
          card.appendChild(body);
          cards.appendChild(card);
        }

        // SNSテンプレ生成
        var displayName = appName || '私の新しいツール';
        var catchCopy = data.shortCatchCopy || '日々のゆとりを生み出す相棒';

        var snsTemplates = [
          {
            label: 'Threads・X パターン① 共感型',
            text: '「もっと早く知っていれば…」\n\n私も最初は戸惑っていましたが、あることに気づいてから景色が変わりました。\n\nその体験から生まれた『' + displayName + '』について、noteに想いを綴りました👇\n\n[noteのURLをここに貼る]\n\n#AI活用 #中小企業支援 #業務効率化'
          },
          {
            label: 'Threads・X パターン② ノウハウ型',
            text: '日々の負担をそっと手放す3つの考え方。\n\n1. 自分で抱え込まない\n2. 完璧より心地よさ\n3. 相棒となる道具に頼る\n\n私が作った『' + displayName + '』について詳しくnoteに書きました👇\n\n[noteのURLをここに貼る]\n\n#AI活用 #業務改善 #中小企業'
          },
          {
            label: 'Threads・X パターン③ 問いかけ型',
            text: 'ふと振り返ったとき、どちらを選びたいですか？\n\nA：これまで通り時間をかけて頑張る\nB：新しい道具を使って心にゆとりを持つ\n\n「B」に惹かれた方へ、私が作った『' + displayName + '』のご案内です👇\n\n[noteのURLをここに貼る]\n\n#AI #業務効率化 #起業'
          },
          {
            label: 'Threads・X パターン④ パートナー募集型',
            text: '【ご案内】同じ想いを持つ方を募集しています。\n\n誰もが無理なく使えるように、という願いを込めて『' + displayName + '』を作りました。\n\n一緒に育ててくださる方、ぜひnoteをお読みください👇\n\n[noteのURLをここに貼る]\n\n#AI活用 #新サービス #中小企業支援'
          }
        ];

        var midjourneyPrompt = 'A professional Japanese blog header image, dark navy blue gradient background (#1a2e5a to #2a4d9e), glowing abstract icons representing trust and innovation, clean modern UI elements, bold white Japanese typography reading "' + displayName + '" and "' + catchCopy + '", gold accent highlights (#e8b830), soft blue glow effects, banner format, 8k resolution --ar 1.91:1 --v 6.0';

        var snsArea = document.getElementById('snsArea');
        snsArea.innerHTML = '';

        var snsTitle = document.createElement('div');
        snsTitle.innerHTML = '<h3 class="text-xl font-bold text-slate-800 mb-1">📱 SNS集客投稿テンプレ（Threads・X対応）</h3><p class="text-sm text-slate-500">noteへ誘導するSNS投稿文です。URLを差し替えてそのまま使えます。</p>';
        snsArea.appendChild(snsTitle);

        var snsGrid = document.createElement('div');
        snsGrid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4';

        var snsAllText = '';
        for (var j = 0; j < snsTemplates.length; j++) {
          var t = snsTemplates[j];
          snsAllText += '【' + t.label + '】\n' + t.text + '\n\n------------------------\n\n';

          var snsCard = document.createElement('div');
          snsCard.className = 'bg-white border border-slate-200 rounded-xl p-5 shadow-sm flex flex-col';

          var snsHeader = document.createElement('div');
          snsHeader.className = 'flex justify-between items-center mb-3';

          var snsLabel = document.createElement('span');
          snsLabel.className = 'text-xs font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded';
          snsLabel.textContent = t.label;

          var snsCopyBtn = document.createElement('button');
          snsCopyBtn.className = 'text-xs font-bold px-3 py-1.5 bg-teal-50 hover:bg-teal-100 text-teal-600 rounded-lg';
          snsCopyBtn.textContent = '📋 コピー';
          (function(txt) {
            snsCopyBtn.addEventListener('click', function() { copyText(txt, 'SNS投稿をコピーしました！'); });
          })(t.text);

          snsHeader.appendChild(snsLabel);
          snsHeader.appendChild(snsCopyBtn);

          var snsBody = document.createElement('div');
          snsBody.className = 'text-sm text-slate-700 whitespace-pre-wrap leading-relaxed flex-1 bg-slate-50 p-3 rounded-lg border border-slate-100 mt-2';
          snsBody.textContent = t.text;

          snsCard.appendChild(snsHeader);
          snsCard.appendChild(snsBody);
          snsGrid.appendChild(snsCard);
        }
        snsArea.appendChild(snsGrid);

        var mjSection = document.createElement('div');
        var mjDiv = document.createElement('div');
        mjDiv.innerHTML = '<h3 class="text-xl font-bold text-slate-800 mb-2">🎨 note見出し画像用 Midjourneyプロンプト</h3><div class="mt-2 inline-block bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 mb-4">💡 AI考案サブキャッチ：<span class="text-teal-600">「' + catchCopy + '」</span></div>';
        mjSection.appendChild(mjDiv);

        var mjBox = document.createElement('div');
        mjBox.className = 'bg-slate-900 rounded-xl p-5 relative';

        var mjCopyBtn = document.createElement('button');
        mjCopyBtn.className = 'absolute top-4 right-4 text-slate-300 hover:text-white text-xs font-medium px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg';
        mjCopyBtn.textContent = '📋 コピー';
        mjCopyBtn.addEventListener('click', function() { copyText(midjourneyPrompt, 'プロンプトをコピーしました！'); });

        var mjText = document.createElement('p');
        mjText.className = 'text-slate-300 text-sm font-mono leading-relaxed pr-20 break-all';
        mjText.textContent = midjourneyPrompt;

        mjBox.appendChild(mjCopyBtn);
        mjBox.appendChild(mjText);
        mjSection.appendChild(mjBox);
        snsArea.appendChild(mjSection);

        allCopyText = articleText + '━━━━━━━━━━━━━━━━━━━━\n\n■ SNS集客投稿テンプレ\n\n' + snsAllText + '━━━━━━━━━━━━━━━━━━━━\n\n■ Midjourneyプロンプト\n\n' + midjourneyPrompt;

        document.getElementById('resultArea').classList.remove('hidden');
        document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });

      } catch(err) {
        document.getElementById('loadingArea').classList.add('hidden');
        document.getElementById('inputArea').classList.remove('hidden');
        var errDiv = document.getElementById('errorMsg');
        errDiv.textContent = '生成に失敗しました: ' + err.message;
        errDiv.classList.remove('hidden');
        showToast('生成に失敗しました', true);
      }
    }
  </script>
</body>
</html>
