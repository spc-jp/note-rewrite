<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Rewrite & Sales Supporter</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    input[type="checkbox"] {
      accent-color: #0d9488; /* Teal color for sales focus */
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // --- アイコンパーツ ---
    const IconPen = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
    const IconLink = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
    const IconLoader = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const IconCopy = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconCheckCircle = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconSparkles = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"></path></svg>;
    const IconSmartphone = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
    const IconImage = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconBookOpen = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
    const IconLightbulb = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18h6"></path><path d="M10 22h4"></path><path d="M12 2v1"></path><path d="M12 7v1"></path><path d="M4 12h1"></path><path d="M19 12h1"></path><path d="M5.64 5.64l.71.71"></path><path d="M17.66 17.66l.71.71"></path><path d="M5.64 18.36l.71-.71"></path><path d="M17.66 6.34l.71-.71"></path><path d="M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M9.17 15a6 6 0 0 1-1.17-3 6 6 0 0 1 12 0 6 6 0 0 1-1.17 3"></path></svg>;
    const IconHelpCircle = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
    const IconUsers = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;

    // トースト通知関数
    const showToast = (message, isError = false) => {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl z-50 text-sm font-bold flex items-center gap-3 transition-all duration-500 transform translate-y-10 opacity-0 ${isError ? 'bg-red-600 text-white' : 'bg-slate-800 text-white border border-slate-700'}`;
      
      toast.innerHTML = isError 
        ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ${message}`
        : `<svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${message}`;

      document.body.appendChild(toast);
      
      requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => document.body.contains(toast) && document.body.removeChild(toast), 500);
      }, 3000);
    };

    const copyToClipboard = (text, message = 'コピーしました！') => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(message);
      } catch (err) {
        showToast('コピーに失敗しました。', true);
      }
      document.body.removeChild(textArea);
    };

    function App() {
      // 入力ステート群
      const [noteUrl, setNoteUrl] = useState('');
      const [appName, setAppName] = useState('');
      const [appUrl, setAppUrl] = useState('');
      const [appConcept, setAppConcept] = useState('');
      const [stripeUrl, setStripeUrl] = useState('');

      // パターン選択ステート
      const [selectedPatterns, setSelectedPatterns] = useState({
        story: true,
        knowhow: false,
        question: false,
        partner: false
      });

      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedResults, setGeneratedResults] = useState(null);
      const resultsRef = useRef(null);

      // 一括生成処理
      const handleGenerateAll = () => {
        // 最低限の入力チェック
        if (!noteUrl || !appName || !appConcept) {
          alert("「元のnote記事URL」「販売する商品/アプリの名前」「そのコンセプト」は最低限入力してください。");
          return;
        }

        setIsGenerating(true);
        setGeneratedResults(null);
        
        // 読込・生成のモック遅延
        setTimeout(() => {
          const res = {};
          
          const titleBase = appName;
          const displayAppUrl = appUrl || stripeUrl || "https://example.com";
          const displayStripeUrl = stripeUrl || "https://buy.stripe.com/example";
          const hashtags = "#暮らしの工夫 #心地よい暮らし #新しい学び #私の小さな挑戦 #ゆとりのある時間 #自分と向き合う #大人の挑戦";

          if (selectedPatterns.story) {
            res.story = {
              title: `【私の体験談】なぜ、この${appName}を作ろうと思ったのか`,
              content: `## はじめに\n「もっと早く、こんな道具があればよかったのに…」\n\n日々の暮らしや作業の中で、ふとそんな風にため息をついた経験はありませんか？私も以前は、同じような悩みを抱えながら、見えない何かに追われるように毎日を過ごしていました。\n\n過去の記事（${noteUrl}）でも少し触れましたが、新しいことを始めようとするたびに、専門用語の壁や複雑な手順に阻まれ、「やはり私には向いていないのかもしれない」と諦めかけたことが何度もありました。\n\n## 私を変えた、小さな気づき\nしかし、ある時ふと気づいたのです。世の中にある多くの便利な道具は、「すべてを完璧に使いこなす」ためにあるのではなく、「私たちの毎日の負担をほんの少し軽くし、心にゆとりをもたらす」ためにあるのだと。\n\nそこで私は、自分が本当に欲しいと思える、無理なく自然体で寄り添ってくれるような道具を探し始めました。しかし、どれも少し複雑すぎたり、私の手に馴染むものがなかなか見つかりませんでした。\n\n「それならば、いっそ自分が使いやすいと思えるものを形にしてみよう」\nそれが、すべての始まりでした。\n\n## ${appName}に込めた想い\nそうして試行錯誤を重ねて生まれたのが、『${appName}』です。\n\nこのツールは、単なる便利な道具ではありません。${appConcept}という願いを込めて、まるで長年連れ添った文房具のように、手に馴染み、穏やかな気持ちでお使いいただけるように設計しました。\n\n決して急かすことなく、ご自身の心地よいペースでお使いいただける。そんなパートナーのような存在になれればと願っています。\n\n## おわりに\nもし、過去の私と同じように、日々の忙しさの中でふと立ち止まり、「もっと自分らしく、ゆったりと進めたい」と感じていらっしゃる方がいれば、ぜひ一度、この『${appName}』に触れてみてください。\n\n少しでも皆様の日々に、穏やかな彩りを添えるお手伝いができれば、これ以上の喜びはありません。\n\n▼ 『${appName}』の詳しいご案内はこちらからゆっくりとご覧いただけます\n${displayAppUrl}\n\n▼ すぐにお試しになりたい方は、こちらからお手続きいただけます\n${displayStripeUrl}\n\n${hashtags}`
            };
          }

          if (selectedPatterns.knowhow) {
            res.knowhow = {
              title: `今日からできる。日々の負担をそっと手放すための3つの考え方`,
              content: `## はじめに\n毎日やるべきことに追われ、「今日も自分の時間が持てなかった」と肩を落としてしまうことはありませんか？\n\nかつての私も、手帳にびっしりと予定を書き込み、それをこなすことだけで1日が終わってしまうような生活をしていました。以前の記事（${noteUrl}）でもお話ししましたが、無理をして頑張り続けることには、いつか限界が来てしまいます。\n\n今日は、私がそんな日々から少しずつ抜け出し、心にゆとりを持てるようになった「3つの考え方」を、皆様にお裾分けしたいと思います。\n\n## 心を軽くする3つのコツ\n\n### 1. 「すべてを自分でやらなければ」という思い込みを手放す\nまずは、これが一番大切です。真面目な方ほど、すべてを自分で抱え込んでしまいがちです。しかし、時には周りの人や、便利な道具に頼ることも、決して悪いことではありません。\n\n### 2. 「完璧」よりも「心地よさ」を優先する\n100点満点を目指すあまり、心が疲弊してしまっては元も子もありません。今日は60点でも、自分が心地よく過ごせたなら、それは素晴らしい1日なのだと認めてあげましょう。\n\n### 3. 自分に寄り添ってくれる「相棒」を見つける\nそして3つ目は、自分の代わりに面倒な作業を引き受けてくれる、頼もしい道具を見つけることです。\n\n実は、私が${appConcept}を実現するために開発した『${appName}』は、まさにこの「相棒」になることを目指して作りました。\n\n## 頼れる相棒、『${appName}』\nこのツールは、難しい操作を覚える必要はありません。ご自身のペースで、ただそこにあるだけで日々の作業がスッと楽になるような、そんな設計を心がけました。\n\n肩の力を抜いて、「ちょっとこれ、手伝ってくれる？」と声をかけるように使っていただければ嬉しいです。\n\n## おわりに\n毎日を少しだけ身軽に生きるためのヒント、いかがでしたでしょうか。\nご自身に合った方法で、心地よい時間を取り戻していただけることを願っています。\n\nもし『${appName}』が、そのための小さな助けになれそうでしたら、ぜひ詳細を覗いてみてくださいね。\n\n▼ 『${appName}』のご案内はこちらから\n${displayAppUrl}\n\n▼ ご利用のお申し込みはこちらです\n${displayStripeUrl}\n\n${hashtags}`
            };
          }

          if (selectedPatterns.question) {
            res.question = {
              title: `ふと立ち止まったとき、今のやり方をこれからも続けたいですか？`,
              content: `## はじめに\nふと一息ついたとき、今の自分のやり方について、こんな風に立ち止まって考えたことはありませんか？\n\n「毎日一生懸命やっているけれど、このままずっと同じペースで続けられるかしら…」\n「もっとスマートに、心に余裕を持てる方法はないのだろうか…」\n\n以前、私はこちらの記事（${noteUrl}）で、日々の取り組み方について少しお話ししました。その中で多くの方から、「私も同じように悩んでいます」という共感のお声をいただきました。\n\n## どちらの道を選びますか？\nもし今、目の前に2つの分かれ道があるとしたら、皆様はどちらを選びたいですか？\n\n【Aの道】これまで通り、自分の時間と体力を削りながら、地道に頑張り続ける道。\n【Bの道】新しい工夫を取り入れて、やるべきことはしっかりと終えつつ、温かいお茶を飲むゆとりを持てる道。\n\nもし、少しでも「Bの道」に心惹かれるものがあったなら。ぜひ、今日からそのための一歩を踏み出してみませんか？\n\n## ゆとりを生み出すためのご提案\n「Bの道」を選ぶために、決して大きな決断や、難しい専門知識は必要ありません。\n\n私が皆様に一つご提案したいのが、${appConcept}という特徴を持った『${appName}』を取り入れていただくことです。\n\nこのツールは、皆様がこれまで抱えていた煩雑な作業を、まるでお抱えのアシスタントのように、静かに、そして確実にサポートしてくれます。複雑な設定で皆様を悩ませるようなことはいたしません。\n\n## おわりに\n「もっと早く、このやり方を知っていればよかった」\n\n実際に使い始めてくださった方からは、そんな嬉しいお言葉をいただいています。\nもし今のやり方に少しでも窮屈さを感じているのであれば、ほんの少しだけ、道具に頼ってみるという選択をしてみませんか？\n\nご興味がありましたら、ぜひ詳しい内容をご覧になってみてください。\n\n▼ 『${appName}』がどのように皆様の助けになるか、こちらでご紹介しています\n${displayAppUrl}\n\n▼ 新しい一歩を踏み出す方はこちらからどうぞ\n${displayStripeUrl}\n\n${hashtags}`
            };
          }

          if (selectedPatterns.partner) {
            res.partner = {
              title: `【ご案内】同じ想いを共有し、一緒に歩んでくださる方へ`,
              content: `## はじめに\nいつも私の発信をご覧いただき、温かいお言葉を寄せてくださり、本当にありがとうございます。\n\n以前、こちらの記事（${noteUrl}）で、私が大切にしている価値観や、これからの活動についての想いを綴らせていただきました。今日は、その想いに共感してくださる皆様へ、一つ特別なご案内があります。\n\n## ひとつの形になった想い\nこれまで、多くの方のお悩みや声に耳を傾ける中で、「もっと自然体で、誰もが無理なく取り組める環境を作れないだろうか」と、ずっと考え続けてきました。\n\nそして、その一つの答えとして形になったのが、${appConcept}を実現するためのツール、『${appName}』です。\n\nこのツールは、単なる無機質なシステムではなく、使う方の心に寄り添い、日々の負担をそっと肩代わりしてくれるような存在を目指して開発いたしました。\n\n## 一緒に育てていきませんか\nしかし、この『${appName}』は、まだ産声を上げたばかりです。\n皆様に実際に使っていただき、忌憚のないご意見や、「こんな風に使ってみたらとても良かった」というお声をいただくことで、さらに優しく、使い勝手の良いものへと成長していくと信じています。\n\nそこで、このツールの初期からの理解者となり、一緒に大切に育ててくださる「パートナー」のような存在を、今回募集させていただくこととなりました。\n\n・私の想いや、過去の記事の内容に共感してくださる方\n・日々の暮らしや活動に、少しのゆとりと新しい風を取り入れたい方\n\nもし、そんな風に感じていただける方がいらっしゃいましたら、ぜひお力を貸していただけないでしょうか。\n\n## おわりに\n何かを新しく始めるとき、一人では不安なことも、同じ想いを持つ仲間がいれば、心強いものです。\n\nぜひ、皆様のお力添えをいただければ幸いです。詳しいご案内は以下のリンクにまとめておりますので、お時間のある時にゆっくりとご覧ください。\n\n▼ 『${appName}』の詳細と、今後のビジョンについて\n${displayAppUrl}\n\n▼ 一緒に歩んでくださる（ご購入・ご参加）方はこちらからお願いいたします\n${displayStripeUrl}\n\n${hashtags}`
            };
          }

          setGeneratedResults(res);
          setIsGenerating(false);

          setTimeout(() => {
            resultsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);

        }, 2000);
      };

      // 一括コピー用テキスト生成
      const getAllContentText = () => {
        if (!generatedResults) return '';
        let text = '';
        
        Object.entries(generatedResults).forEach(([key, result]) => {
          let patternName = "";
          if(key === "story") patternName = "ストーリー型（体験談から自然に誘導）";
          if(key === "knowhow") patternName = "ノウハウ型（お役立ち情報から誘導）";
          if(key === "question") patternName = "問いかけ型（悩みに寄り添い誘導）";
          if(key === "partner") patternName = "パートナー募集型（想いを共有して誘導）";

          text += `■ 【${patternName}】\nタイトル：${result.title}\n\n${result.content}\n\n━━━━━━━━━━━━━━━━━━━━\n\n`;
        });
        
        return text.trim();
      };

      const isNoPatternSelected = !Object.values(selectedPatterns).some(v => v);

      return (
        <div className="min-h-screen bg-slate-50 font-sans text-slate-800 p-6 pb-24">
          <div className="max-w-4xl mx-auto space-y-8">
            
            {/* ヘッダー */}
            <div className="text-center space-y-4 pt-4">
              <span className="inline-block px-3 py-1 bg-teal-100 text-teal-800 text-xs font-bold tracking-wider rounded-full uppercase mb-2">Sales Edition</span>
              <h1 className="text-3xl font-bold text-teal-700 flex items-center justify-center gap-2">
                <IconPen className="w-8 h-8" />
                Note Rewrite & Sales Supporter
              </h1>
              <p className="text-slate-500 font-medium">過去のnote記事をフックにして、ご自身の商品やアプリを自然に販売するための記事を自動生成します。</p>
            </div>

            {/* 1. 情報入力セクション */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-in">
              <div className="bg-slate-100/50 px-6 py-4 border-b border-slate-200">
                <h2 className="text-lg font-bold text-slate-700 flex items-center gap-2">
                  <span className="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">1</span>
                  販売に必要な情報を入力してください
                </h2>
              </div>
              <div className="p-6 md:p-8 space-y-6">
                
                <div>
                  <label className="block text-sm font-bold text-slate-700 mb-2">① 元になる過去のnote記事URL <span className="text-red-500">*</span></label>
                  <input
                    type="text"
                    value={noteUrl}
                    onChange={(e) => setNoteUrl(e.target.value)}
                    placeholder="https://note.com/your_account/n/xxxxx"
                    className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none"
                  />
                  <p className="text-xs text-slate-500 mt-1">※この過去記事の内容（モック）を文脈に織り交ぜて記事が始まります。</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">② 販売する商品・アプリの名前 <span className="text-red-500">*</span></label>
                    <input
                      type="text"
                      value={appName}
                      onChange={(e) => setAppName(e.target.value)}
                      placeholder="例：情報まもるくん 完全ローカル"
                      className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">③ アプリのコンセプト（どう役立つか） <span className="text-red-500">*</span></label>
                    <input
                      type="text"
                      value={appConcept}
                      onChange={(e) => setAppConcept(e.target.value)}
                      placeholder="例：外部通信ゼロで安全にデータを保護する"
                      className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">④ アプリの案内ページURL (LP等)</label>
                    <input
                      type="text"
                      value={appUrl}
                      onChange={(e) => setAppUrl(e.target.value)}
                      placeholder="https://..."
                      className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-bold text-slate-700 mb-2">⑤ Stripe等 決済・購入リンク <span className="text-red-500">*</span></label>
                    <input
                      type="text"
                      value={stripeUrl}
                      onChange={(e) => setStripeUrl(e.target.value)}
                      placeholder="https://buy.stripe.com/..."
                      className="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none bg-teal-50/30"
                    />
                  </div>
                </div>

              </div>
            </div>

            {/* 2. パターン選択 ＆ 生成ボタン */}
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden animate-in">
              <div className="bg-slate-100/50 px-6 py-4 border-b border-slate-200">
                <h2 className="text-lg font-bold text-slate-700 flex items-center gap-2">
                  <span className="bg-teal-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm">2</span>
                  どのように記事を生まれ変わらせますか？（複数可）
                </h2>
              </div>
              
              <div className="p-6 md:p-8">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <PatternToggle 
                    icon={<IconBookOpen/>} label="ストーリー型（体験談）" description="ご自身の過去の悩みや経験から、アプリ開発の理由を語り、共感を通じて自然に販売へ繋げます。" 
                    checked={selectedPatterns.story} onChange={(c) => setSelectedPatterns({...selectedPatterns, story: c})} 
                  />
                  <PatternToggle 
                    icon={<IconLightbulb/>} label="ノウハウ型（価値提供）" description="読者に役立つ3つの考え方を提供した上で、最後の解決策としてアプリを優しく提案します。" 
                    checked={selectedPatterns.knowhow} onChange={(c) => setSelectedPatterns({...selectedPatterns, knowhow: c})} 
                  />
                  <PatternToggle 
                    icon={<IconHelpCircle/>} label="問いかけ型（課題解決）" description="読者の現状の悩みに問いかけ、今のやり方を変えるひとつの選択肢としてアプリを案内します。" 
                    checked={selectedPatterns.question} onChange={(c) => setSelectedPatterns({...selectedPatterns, question: c})} 
                  />
                  <PatternToggle 
                    icon={<IconUsers/>} label="パートナー募集型" description="同じ想いを持つ方を募る形で、ツールの初期ユーザーや購入者へ温かく呼びかけます。" 
                    checked={selectedPatterns.partner} onChange={(c) => setSelectedPatterns({...selectedPatterns, partner: c})} 
                  />
                </div>

                <button 
                  onClick={handleGenerateAll}
                  disabled={isNoPatternSelected || !noteUrl || !appName || !appConcept}
                  className="w-full mt-8 bg-teal-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-teal-700 transition-colors flex justify-center items-center gap-2 text-lg disabled:bg-slate-300 disabled:cursor-not-allowed"
                >
                  <IconSparkles className="w-6 h-6" />
                  セールス記事を一括生成する
                </button>
              </div>
            </div>

            {/* ローディング表示 */}
            {isGenerating && (
              <div className="flex flex-col items-center justify-center py-20 text-teal-600 animate-in fade-in duration-500">
                <IconLoader className="w-12 h-12 animate-spin mb-4" />
                <p className="font-bold text-lg">あなたらしい、優しく自然なセールス文章を作成しています...</p>
                <p className="text-sm text-slate-500 mt-2">（各パターン約1500文字のボリュームを出力します）</p>
              </div>
            )}

            {/* 生成結果の表示エリア */}
            {generatedResults && (
              <div ref={resultsRef} className="space-y-8 pt-4 animate-in fade-in slide-in-from-bottom-8 duration-700">
                
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-slate-800 flex items-center justify-center gap-2">
                    <IconCheckCircle className="w-8 h-8 text-teal-500"/>
                    セールス記事の生成が完了しました！
                  </h2>
                  <p className="text-slate-500 mt-2">押し付けがましくない、穏やかなトーンで購買へ導く記事構成になっています。</p>
                </div>

                {generatedResults.story && (
                  <ResultSection title="ストーリー型（体験談から自然に誘導）" icon={<IconBookOpen />} result={generatedResults.story} />
                )}
                {generatedResults.knowhow && (
                  <ResultSection title="ノウハウ型（お役立ち情報から誘導）" icon={<IconLightbulb />} result={generatedResults.knowhow} />
                )}
                {generatedResults.question && (
                  <ResultSection title="問いかけ型（悩みに寄り添い誘導）" icon={<IconHelpCircle />} result={generatedResults.question} />
                )}
                {generatedResults.partner && (
                  <ResultSection title="パートナー募集型（想いを共有して誘導）" icon={<IconUsers />} result={generatedResults.partner} />
                )}

                {/* SNS告知文面＆画像P 提案（一括コピー） */}
                <SnsAndImageTemplates 
                  appName={appName} 
                  appConcept={appConcept}
                  mainContentText={getAllContentText()}
                />
              </div>
            )}
          </div>
        </div>
      );
    }

    // パターン選択用のチェックボックスUI
    const PatternToggle = ({ icon, label, description, checked, onChange }) => (
      <label className={`flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer transition-all duration-200 ${checked ? 'border-teal-500 bg-teal-50/50 shadow-sm' : 'border-slate-100 bg-white hover:border-teal-200 hover:bg-slate-50'}`}>
        <div className="mt-0.5">
          <input type="checkbox" className="w-5 h-5 cursor-pointer" checked={checked} onChange={(e) => onChange(e.target.checked)} />
        </div>
        <div className="flex-1">
          <div className="font-bold text-slate-800 flex items-center gap-2">
            {React.cloneElement(icon, {className: `w-5 h-5 ${checked ? 'text-teal-600' : 'text-slate-400'}`})}
            {label}
          </div>
          <p className="text-sm text-slate-500 mt-1.5 leading-relaxed">{description}</p>
        </div>
      </label>
    );

    // 記事結果表示の共通枠コンポーネント
    const ResultSection = ({ title, icon, result }) => {
      const fullText = `${result.title}\n\n${result.content}`;
      return (
        <div className="bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden">
          <div className="bg-teal-50/60 px-5 py-4 border-b border-teal-100 flex justify-between items-center">
            <span className="font-bold text-teal-900 flex items-center gap-2">
              {React.cloneElement(icon, {className: 'w-5 h-5'})}
              {title}
            </span>
            <button 
              onClick={() => copyToClipboard(fullText, '記事をコピーしました！')}
              className="text-teal-700 hover:text-teal-900 text-sm font-bold flex items-center gap-1.5 px-3 py-1.5 bg-white border border-teal-200 rounded-lg shadow-sm transition-colors"
            >
              <IconCopy className="w-4 h-4" />この記事をコピー
            </button>
          </div>
          <div className="p-6 md:p-8">
            <h3 className="text-xl font-bold text-slate-800 mb-6 border-b pb-4">{result.title}</h3>
            <div className="whitespace-pre-wrap text-slate-700 font-medium leading-relaxed max-h-[600px] overflow-y-auto pr-2">
              {result.content}
            </div>
          </div>
        </div>
      );
    }

    // --- SNS誘導テンプレ ＆ Midjourneyプロンプト 共通コンポーネント ---
    function SnsAndImageTemplates({ appName, appConcept, mainContentText }) {
      const displayAppName = appName || "私の新しいツール";
      
      const snsTemplates = [
        {
          label: "パターン① 共感型（寄り添い）",
          text: `「もっと早く知っていれば…」\n\n私も最初は難しくて戸惑っていましたが、あることに気づいてから景色が少し変わりました。\n\nその体験から生まれた『${displayAppName}』について、noteに想いを綴りました👇\n\n[記事URLをここに貼り付け]`
        },
        {
          label: "パターン② ノウハウ（お裾分け）",
          text: `日々の負担をそっと手放すための3つの考え方。\n\n1. 自分で抱え込まない\n2. 完璧より心地よさ\n3. 相棒となる道具に頼る\n\n私が作った優しい相棒『${displayAppName}』のご案内も添えて、noteにまとめました👇\n\n[記事URLをここに貼り付け]`
        },
        {
          label: "パターン③ 問いかけ型（穏やか）",
          text: `ふと振り返ったとき、どちらを選びたいですか？\n\nA：これまで通り、時間をかけて頑張る\nB：新しい道具を取り入れて、心にゆとりを持つ\n\nもし「B」に惹かれた方は、私が作った『${displayAppName}』が少しお役に立てるかもしれません。詳細はこちら👇\n\n[記事URLをここに貼り付け]`
        },
        {
          label: "パターン④ パートナー募集",
          text: `【お知らせ】同じ想いを持つ方を募集しています。\n\n誰もが無理なく使えるように、という願いを込めて『${displayAppName}』を作りました。\n\n一緒にこの道具を育ててくださる方、ぜひnoteの詳しい想いをお読みいただければ幸いです👇\n\n[記事URLをここに貼り付け]`
        }
      ];

      // Midjourneyプロンプト
      const midjourneyPrompt = `A professional Japanese blog header image, dark navy blue gradient background (#1a2e5a to #2a4d9e), glowing abstract icons representing safety and trust, subtle circuit board texture overlay, clean modern UI elements, bold white Japanese typography reading "${displayAppName}" and "${appConcept}", gold accent highlights (#e8b830), soft blue glow effects, trustworthy and professional atmosphere, banner format, 8k resolution, highly detailed --ar 1.91:1 --v 6.0`;

      const handleCopyAll = () => {
        const snsText = snsTemplates.map(t => `【${t.label}】\n${t.text}`).join('\n\n------------------------\n\n');
        const fullText = `${mainContentText}\n━━━━━━━━━━━━━━━━━━━━\n\n■ SNS誘導テンプレ\n\n${snsText}\n\n━━━━━━━━━━━━━━━━━━━━\n\n■ 見出し画像用 Midjourneyプロンプト (V8想定)\n\n${midjourneyPrompt}`;
        copyToClipboard(fullText, '生成されたすべての内容を一括コピーしました！');
      };

      return (
        <div className="mt-12 pt-10 border-t-2 border-slate-200 space-y-10">
          
          <div className="bg-teal-50 border border-teal-100 rounded-2xl p-6 text-center shadow-sm">
            <h3 className="text-lg font-bold text-teal-900 mb-2">すべての準備が整いました！</h3>
            <p className="text-sm text-teal-700 mb-6">生成されたセールス記事、集客用のSNSテンプレ、見出し画像用プロンプトをまとめてコピーできます。</p>
            <button 
              onClick={handleCopyAll}
              className="bg-slate-800 text-white px-8 py-4 rounded-xl inline-flex items-center justify-center gap-3 text-base font-bold hover:bg-slate-900 transition-colors shadow-md border-b-4 border-slate-900 active:border-b-0 active:translate-y-1"
            >
              <IconCopy className="w-6 h-6" /> 全て一括でコピーする（生成文・SNS・画像P）
            </button>
          </div>

          <div>
            <div className="mb-6">
              <h4 className="text-xl font-bold text-slate-800 flex items-center gap-2 mb-1">
                <IconSmartphone className="w-6 h-6 text-teal-600" /> 
                SNSでnoteへ誘導する文面テンプレ
              </h4>
              <p className="text-sm text-slate-500">入力されたアプリ名（{displayAppName}）が自然に組み込まれています。</p>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {snsTemplates.map((t, i) => (
                <div key={i} className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm group hover:border-teal-300 transition-colors flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs font-bold text-teal-700 bg-teal-50 px-2.5 py-1 rounded">{t.label}</span>
                    <button 
                      className="text-teal-600 opacity-0 group-hover:opacity-100 transition-opacity text-xs font-medium px-3 py-1.5 bg-teal-50 hover:bg-teal-100 rounded-lg flex items-center gap-1"
                      onClick={() => copyToClipboard(t.text, 'SNSテンプレをコピーしました！')}
                    >
                      <IconCopy className="w-3 h-3" />個別コピー
                    </button>
                  </div>
                  <div className="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed flex-1 bg-slate-50 p-3 rounded-lg border border-slate-100">
                    {t.text}
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <div className="mb-4">
              <h4 className="text-xl font-bold text-slate-800 flex items-center gap-2 mb-1">
                <IconImage className="w-6 h-6 text-teal-600" /> 
                🎨 note見出し画像用 Midjourneyプロンプト
              </h4>
              <p className="text-sm text-slate-500">入力されたアプリ名とコンセプトが組み込まれた、クリックしたくなる見出し画像用プロンプトです。</p>
            </div>

            <div className="bg-slate-900 rounded-xl p-5 shadow-inner relative group mt-4">
              <button 
                className="absolute top-4 right-4 text-slate-300 hover:text-white text-xs font-medium px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg flex items-center gap-1 transition-colors"
                onClick={() => copyToClipboard(midjourneyPrompt, 'プロンプトをコピーしました！')}
              >
                <IconCopy className="w-4 h-4" />個別コピー
              </button>
              <p className="text-slate-300 text-sm font-mono leading-relaxed pr-20 break-all">
                {midjourneyPrompt}
              </p>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
