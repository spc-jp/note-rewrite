<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Rewrite Supporter</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (アプリの動作基盤) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ上でコードを翻訳する機能) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アニメーション用のカスタムクラス */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
    
    /* チェックボックスのスタイル調整用 */
    input[type="checkbox"] {
      accent-color: #4f46e5;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <!-- アプリが描画される場所 -->
  <div id="root"></div>

  <!-- アプリのプログラム本体 -->
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- アイコンパーツ ---
    const IconPen = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
    const IconFileText = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconScissors = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>;
    const IconListPlus = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line><line x1="12" y1="18" x2="18" y2="18"></line><line x1="15" y1="15" x2="15" y2="21"></line></svg>;
    const IconLink = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
    const IconLoader = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const IconCopy = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconCheckCircle = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconPlus = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const IconArrowRight = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const IconSmartphone = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
    const IconImage = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;
    const IconSparkles = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 001.275-1.275L12 3z"></path></svg>;

    // フワッと出て消える優しい通知（トースト）を表示する関数
    const showToast = (message, isError = false) => {
      const toast = document.createElement('div');
      toast.className = `fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl z-50 text-sm font-bold flex items-center gap-3 transition-all duration-500 transform translate-y-10 opacity-0 ${isError ? 'bg-red-600 text-white' : 'bg-gray-800 text-white border border-gray-700'}`;
      
      toast.innerHTML = isError 
        ? `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> ${message}`
        : `<svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> ${message}`;

      document.body.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-10', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0');
        setTimeout(() => {
          if (document.body.contains(toast)) {
            document.body.removeChild(toast);
          }
        }, 500);
      }, 3000);
    };

    // クリップボードにコピーする共通関数
    const copyToClipboard = (text, message = 'コピーしました！') => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast(message);
      } catch (err) {
        console.error('コピーに失敗しました', err);
        showToast('コピーに失敗しました。お手数ですが手動でコピーをお願いいたします。', true);
      }
      document.body.removeChild(textArea);
    };

    function App() {
      // 記事情報の状態
      const [mainUrl, setMainUrl] = useState('');
      const [isFetching, setIsFetching] = useState(false);
      const [articleData, setArticleData] = useState(null);

      // 選択された機能のチェック状態
      const [selectedFeatures, setSelectedFeatures] = useState({
        title: true,
        intro: true,
        split: false,
        summary: false
      });

      // まとめ記事用のURLリスト
      const [summaryUrls, setSummaryUrls] = useState([]);
      const [newSummaryUrl, setNewSummaryUrl] = useState('');

      // 生成処理の状態
      const [isGenerating, setIsGenerating] = useState(false);
      const [generatedResults, setGeneratedResults] = useState(null);

      const resultsRef = useRef(null);

      // 1. URLから記事を読み込む処理
      const handleFetchArticle = () => {
        if (!mainUrl.includes('note.com')) {
          alert('noteのURLを入力してください。（※プロトタイプのためダミーデータを読み込みます）');
          return;
        }
        setIsFetching(true);
        setTimeout(() => {
          setArticleData({
            url: mainUrl,
            title: 'AI活用のコツと明日から使えるプロンプト術',
            content: '今回はAIの活用方法について解説します。AIを使うと業務がとても効率化されます。ぜひ読んでみてください。\n\n第1章：AIに対するマインドセット...\n第2章：最適なツールの選び方...\n第3章：実践的なプロンプトの書き方...',
          });
          // まとめ記事の1件目にメイン記事をセット
          setSummaryUrls([{ id: Date.now(), url: mainUrl, title: 'AI活用のコツと明日から使えるプロンプト術' }]);
          setGeneratedResults(null); // 前回の結果をクリア
          setIsFetching(false);
        }, 1200);
      };

      // まとめ記事用：URL追加
      const handleAddUrl = () => {
        if (!newSummaryUrl.includes('note.com')) return;
        setSummaryUrls([...summaryUrls, { id: Date.now(), url: newSummaryUrl, title: '（URLから自動取得したタイトル）' }]);
        setNewSummaryUrl('');
      };

      // まとめ記事用：URL削除
      const handleRemoveUrl = (id) => {
        setSummaryUrls(summaryUrls.filter(u => u.id !== id));
      };

      // 2. 選択された機能を「一括」で生成する処理
      const handleGenerateAll = () => {
        setIsGenerating(true);
        setGeneratedResults(null);
        
        setTimeout(() => {
          const res = {};
          
          if (selectedFeatures.title) {
            res.title = [
              `【やさしい解説】${articleData.title}の基本と楽しみ方`,
              `今日から少しずつ始める、${articleData.title}の第一歩`,
              `私が見つけた、無理なく続けられる${articleData.title}のコツ`,
              `もっと早く知りたかった！${articleData.title}のちょっとした工夫`,
            ];
          }

          if (selectedFeatures.intro) {
            res.intro = `## はじめに\n「AIが便利だと聞くけれど、難しそうでなかなか手が出せない…」\nそんな風に感じていらっしゃる方も多いのではないでしょうか？\n\n私も最初は同じように戸惑い、手探りで色々なものに触れる日々でした。新しい横文字ばかりが並ぶ画面を前に、「これは私には向いていないのかもしれない」と、そっとパソコンを閉じてしまったことも一度や二度ではありません。\n\nしかし、ある日ふとしたきっかけで、AIと仲良くなるための"ほんの少しのコツ"に気づいてからは、景色が少しずつ変わり始めました。難しいと思っていた作業がスッと楽になり、その分、お茶を淹れて一息ついたり、散歩に出かけたりと、自分のための時間をゆったりと持てるようになったのです。\n\n## これまでの私と、小さな変化\n昔は、何か新しいことを始めるたびに、分厚い説明書を端から端まで読まなければならないような気がしていました。でも、今の道具は少し違います。\n\n「完璧に使いこなさなければ」という肩の力を抜いて、「ちょっとこれ、手伝ってくれる？」と、まるでお隣さんに声をかけるように接するだけで、驚くほど助けになってくれることに気づいたのです。\n\n無理をして背伸びをする必要はありません。ご自身のペースで、少しずつ慣れていけば良いのです。\n\n## この記事でお伝えしたいこと\n実は、AIを使いこなすために専門的な知識は必要ありません。大切なのは、AIへの「上手な話しかけ方（コツ）」を知ることだけなのです。\n\n複雑な操作を覚える必要はありません。ご自身が日々感じていること、やりたいことを、そのままの言葉で伝える。たったそれだけの工夫で、AIはとても優秀で、そして優しいアシスタントになってくれます。\n\n### 読んでくださる方へ\n本記事では、私が日々の暮らしや活動の中で見つけた「今日からすぐに試せる、優しいAI活用のステップ」を、できるだけわかりやすく丁寧にご紹介します。\n\n「これなら私にもできるかもしれない」\nそんな風に思っていただけるよう、一つひとつの手順をゆっくりと解説していきます。\n\nこの記事を最後までお読みいただければ、AIへの苦手意識が少しずつ和らぎ、明日から頼もしいパートナーとして楽しくお付き合いできるようになるはずです。どうぞ、肩の力を抜いて、温かいお茶でも飲みながらお付き合いくださいね。\n\n---\n▼ 本編はこちらからゆっくりとお読みいただけます\n${articleData.url}\n\n#暮らしの工夫 #心地よい暮らし #新しい学び #私の小さな挑戦 #AIのある暮らし #ゆとりのある時間 #自分と向き合う`;
          }

          if (selectedFeatures.split) {
            res.split = [
              { day: '第1回', title: 'まずはここから。心のハードルを下げてみましょう', desc: 'なぜ今これを取り入れると良いのか、ゆっくりと解説します。' },
              { day: '第2回', title: '自分に合った道具選び。無理なく使えるものを見つける', desc: '難しく考えず、まずは簡単に触れられるツールの選び方。' },
              { day: '第3回', title: '今日から試せる。日々の暮らしを少し豊かにする使い方', desc: '実際に試してみてよかった、具体的な活用方法のお裾分け。' }
            ];
          }

          if (selectedFeatures.summary) {
            let draft = "## はじめに\n「これから始めてみたいけれど、どこから読めばいいのかしら…」\nそんな風に迷われている方へ向けて、これまでの記事の中から、最初にお読みいただきたいものをいくつか選び、まとめてみました。\n\n新しいことを始めるとき、情報がたくさんありすぎると、かえって立ち止まってしまうことがありますよね。私も以前は、どこから手をつけていいのか分からず、ただ時間だけが過ぎてしまうことがありました。\n\nですから、今回は「まずここから読んでいただければ安心です」というものを厳選しています。どうぞ、焦らず、ご自身のペースでゆっくりと読み進めてみてくださいね。\n\n## おすすめ記事まとめ\n\n";
            
            summaryUrls.forEach((u, i) => {
              draft += `### ${i + 1}. ${u.title}\n`;
              draft += `この記事では、具体的なノウハウの前に、まずは心の準備や考え方について丁寧にご紹介しています。\n新しい道具を使うとき、一番大切なのは「難しそう」という気持ちを少しだけ横に置いてみることです。私がどのようにしてその壁を越えたのか、日々のちょっとしたエピソードを交えながらお話ししています。お時間のある時に、ぜひここから読んでみてくださいね。\n`;
              draft += `${u.url}\n\n`;
            });
            
            draft += "## おわりに\nいかがでしたか？\nこれらの記事が、少しでも皆様の参考になり、日々の暮らしに小さな彩りを添えるきっかけになれば嬉しいです。\n\n焦る必要は全くありません。ご自身の心地よいペースで、少しずつ、楽しみながら実践してみてくださいね。これからも、私が試してよかったこと、気づいたことを、この場所でゆっくりとお裾分けしていきたいと思っています。\n\n#暮らしの工夫 #心地よい暮らし #新しい学び #私の小さな挑戦 #AIのある暮らし #ゆとりのある時間 #自分と向き合う";
            
            res.summary = draft;
          }

          setGeneratedResults(res);
          setIsGenerating(false);

          // 生成完了後、結果まで自動スクロール
          setTimeout(() => {
            resultsRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 100);

        }, 2500); // 優しい文章を生成している感を出すため少し長めに待機
      };

      // 生成された「すべてのテキスト」を連結して返す関数（一括コピー用）
      const getAllContentText = () => {
        if (!generatedResults) return '';
        let text = '';
        
        if (generatedResults.title) {
          text += `■ 生成されたタイトル案\n${generatedResults.title.join('\n')}\n\n`;
        }
        if (generatedResults.intro) {
          text += `■ 導入文リライト\n${generatedResults.intro}\n\n`;
        }
        if (generatedResults.split) {
          text += `■ シリーズ化構成案\n${generatedResults.split.map(r => `【${r.day}】${r.title}\n${r.desc}`).join('\n\n')}\n\n`;
        }
        if (generatedResults.summary) {
          text += `■ まとめ記事\n${generatedResults.summary}\n\n`;
        }
        
        return text.trim();
      };

      // チェックボックスのON/OFFが1つもないか確認
      const isNoFeatureSelected = !Object.values(selectedFeatures).some(v => v);

      return (
        <div className="min-h-screen bg-gray-50 font-sans text-gray-800 p-6 pb-24">
          <div className="max-w-4xl mx-auto space-y-8">
            
            {/* 1. ヘッダー＆メインURL入力部 */}
            <div className="text-center space-y-4">
              <h1 className="text-3xl font-bold text-indigo-600 flex items-center justify-center gap-2">
                <IconPen className="w-8 h-8" />
                Note Rewrite Supporter
              </h1>
              <p className="text-gray-500">過去のnote記事URLを貼り付けて、新しいコンテンツに生まれ変わらせましょう。</p>
              
              <div className="max-w-2xl mx-auto bg-white p-2 rounded-full shadow-sm border border-gray-200 flex items-center mt-6">
                <IconLink className="w-5 h-5 text-gray-400 ml-4 mr-2" />
                <input
                  type="text"
                  value={mainUrl}
                  onChange={(e) => setMainUrl(e.target.value)}
                  placeholder="https://note.com/your_account/n/xxxxx"
                  className="flex-1 py-3 px-2 outline-none text-gray-700 bg-transparent"
                  onKeyDown={(e) => e.key === 'Enter' && handleFetchArticle()}
                />
                <button
                  onClick={handleFetchArticle}
                  disabled={isFetching || !mainUrl}
                  className="bg-indigo-600 text-white px-6 py-3 rounded-full font-medium hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex items-center gap-2"
                >
                  {isFetching ? <IconLoader className="w-5 h-5 animate-spin" /> : '記事を読み込む'}
                </button>
              </div>
            </div>

            {/* 2. 機能選択 ＆ 一括生成ボタン */}
            {articleData && !isGenerating && !generatedResults && (
              <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 animate-in">
                
                <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-8 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-indigo-500 mb-1">現在読み込んでいる記事</p>
                    <h2 className="text-base font-bold text-gray-800">{articleData.title}</h2>
                  </div>
                  <a href={articleData.url} target="_blank" rel="noreferrer" className="text-sm text-indigo-600 hover:underline flex items-center gap-1">
                    元記事を確認 <IconArrowRight className="w-4 h-4" />
                  </a>
                </div>

                <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                  <IconSparkles className="w-5 h-5 text-indigo-600"/>
                  作成したいコンテンツにチェックを入れてください（複数可）
                </h3>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <FeatureToggle 
                    icon={<IconPen/>} label="タイトル生成" description="記事の魅力が伝わる新しいタイトル案" 
                    checked={selectedFeatures.title} onChange={(c) => setSelectedFeatures({...selectedFeatures, title: c})} 
                  />
                  <FeatureToggle 
                    icon={<IconFileText/>} label="導入文リライト" description="別記事として投稿できる優しい導入文" 
                    checked={selectedFeatures.intro} onChange={(c) => setSelectedFeatures({...selectedFeatures, intro: c})} 
                  />
                  <FeatureToggle 
                    icon={<IconScissors/>} label="シリーズ化 (分割)" description="長文を複数回の連載記事に分ける構成案" 
                    checked={selectedFeatures.split} onChange={(c) => setSelectedFeatures({...selectedFeatures, split: c})} 
                  />
                  <FeatureToggle 
                    icon={<IconListPlus/>} label="まとめ記事作成" description="複数の記事を束ねる案内記事のベース" 
                    checked={selectedFeatures.summary} onChange={(c) => setSelectedFeatures({...selectedFeatures, summary: c})} 
                  />
                </div>

                {/* まとめ記事用のURL追加UI */}
                {selectedFeatures.summary && (
                  <div className="mt-6 p-5 bg-gray-50 border border-gray-200 rounded-xl animate-in fade-in slide-in-from-top-2">
                    <h4 className="font-bold text-gray-700 mb-3 text-sm">まとめ記事に含めるURLリスト</h4>
                    <div className="space-y-2 mb-3">
                      {summaryUrls.map((u, i) => (
                        <div key={u.id} className="flex items-center gap-3 p-2.5 bg-white border border-gray-200 rounded-lg shadow-sm">
                          <span className="flex-shrink-0 w-5 h-5 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center text-xs font-bold">{i + 1}</span>
                          <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium text-gray-800 truncate">{u.title}</p>
                            <p className="text-xs text-gray-400 truncate">{u.url}</p>
                          </div>
                          {i !== 0 && (
                            <button onClick={() => handleRemoveUrl(u.id)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                              <IconTrash className="w-4 h-4" />
                            </button>
                          )}
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={newSummaryUrl}
                        onChange={(e) => setNewSummaryUrl(e.target.value)}
                        placeholder="追加するnoteのURLを貼り付け"
                        className="flex-1 p-3 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                        onKeyDown={(e) => e.key === 'Enter' && handleAddUrl()}
                      />
                      <button 
                        onClick={handleAddUrl}
                        disabled={!newSummaryUrl.includes('note.com')}
                        className="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium whitespace-nowrap disabled:opacity-50 flex items-center gap-1"
                      >
                        <IconPlus className="w-4 h-4" />追加
                      </button>
                    </div>
                  </div>
                )}

                <button 
                  onClick={handleGenerateAll}
                  disabled={isNoFeatureSelected}
                  className="w-full mt-8 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-indigo-700 transition-colors flex justify-center items-center gap-2 text-lg disabled:bg-indigo-300"
                >
                  <IconSparkles className="w-6 h-6" />
                  選択した項目を一括生成する
                </button>
              </div>
            )}

            {/* 3. ローディング表示 */}
            {isGenerating && (
              <div className="flex flex-col items-center justify-center py-20 text-indigo-600 animate-in fade-in duration-500">
                <IconLoader className="w-12 h-12 animate-spin mb-4" />
                <p className="font-bold text-lg">AIが優しい文章を心を込めて作成しています...</p>
                <p className="text-sm text-gray-500 mt-2">（文章のボリュームが多いため、少しお時間をいただきます）</p>
              </div>
            )}

            {/* 4. 生成結果の表示エリア */}
            {generatedResults && (
              <div ref={resultsRef} className="space-y-8 pt-4 animate-in fade-in slide-in-from-bottom-8 duration-700">
                
                <div className="text-center mb-8">
                  <h2 className="text-2xl font-bold text-gray-800 flex items-center justify-center gap-2">
                    <IconCheckCircle className="w-8 h-8 text-green-500"/>
                    すべての生成が完了しました！
                  </h2>
                  <p className="text-gray-500 mt-2">各項目を確認して、必要に応じて修正しながらお使いください。</p>
                </div>

                {/* タイトル結果 */}
                {generatedResults.title && (
                  <ResultSection title="生成されたタイトル案" icon={<IconPen />} onCopy={() => copyToClipboard(generatedResults.title.join('\n'), 'タイトル案をコピーしました！')}>
                    <div className="space-y-3">
                      {generatedResults.title.map((title, i) => (
                        <div key={i} className="bg-gray-50 p-4 rounded-xl border border-gray-200 text-gray-800 font-medium">
                          {title}
                        </div>
                      ))}
                    </div>
                  </ResultSection>
                )}

                {/* 導入文結果 */}
                {generatedResults.intro && (
                  <ResultSection title="導入文リライト（約1500文字）" icon={<IconFileText />} onCopy={() => copyToClipboard(generatedResults.intro, '導入文をコピーしました！')}>
                    <div className="whitespace-pre-wrap text-gray-700 font-medium leading-relaxed max-h-[500px] overflow-y-auto pr-2">
                      {generatedResults.intro}
                    </div>
                  </ResultSection>
                )}

                {/* シリーズ化（分割）結果 */}
                {generatedResults.split && (
                  <ResultSection title="シリーズ化（分割）構成案" icon={<IconScissors />} onCopy={() => copyToClipboard(generatedResults.split.map(r => `【${r.day}】${r.title}\n${r.desc}`).join('\n\n'), '構成案をコピーしました！')}>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      {generatedResults.split.map((item, i) => (
                        <div key={i} className="bg-gray-50 p-5 rounded-xl border border-gray-200 relative overflow-hidden">
                          <div className="absolute top-0 left-0 w-1 h-full bg-indigo-400"></div>
                          <span className="inline-block px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded mb-3">{item.day}</span>
                          <h4 className="font-bold text-gray-800 mb-2 leading-tight">{item.title}</h4>
                          <p className="text-sm text-gray-600">{item.desc}</p>
                        </div>
                      ))}
                    </div>
                  </ResultSection>
                )}

                {/* まとめ記事結果 */}
                {generatedResults.summary && (
                  <ResultSection title="まとめ記事（約1500文字）" icon={<IconListPlus />} onCopy={() => copyToClipboard(generatedResults.summary, 'まとめ記事をコピーしました！')}>
                    <div className="whitespace-pre-wrap text-gray-700 font-medium leading-relaxed max-h-[500px] overflow-y-auto pr-2">
                      {generatedResults.summary}
                    </div>
                  </ResultSection>
                )}

                {/* やり直すボタン */}
                <div className="flex justify-center pt-4">
                   <button 
                    onClick={() => {
                      setGeneratedResults(null);
                      window.scrollTo({ top: 0, behavior: 'smooth' });
                    }}
                    className="text-gray-500 hover:text-indigo-600 font-medium text-sm underline underline-offset-4"
                   >
                     条件を変えてもう一度生成する
                   </button>
                </div>

                {/* SNS告知文面＆画像P 提案（一括コピー） */}
                <SnsAndImageTemplates 
                  articleTitle={articleData.title} 
                  articleUrl={articleData.url}
                  mainContentText={getAllContentText()}
                />
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- 各種コンポーネント ---

    // チェックボックスのUIコンポーネント
    const FeatureToggle = ({ icon, label, description, checked, onChange }) => (
      <label className={`flex items-start gap-4 p-5 rounded-xl border-2 cursor-pointer transition-all duration-200 ${checked ? 'border-indigo-500 bg-indigo-50/50 shadow-sm' : 'border-gray-100 bg-white hover:border-indigo-200 hover:bg-gray-50'}`}>
        <div className="mt-0.5">
          <input 
            type="checkbox" 
            className="w-5 h-5 cursor-pointer" 
            checked={checked} 
            onChange={(e) => onChange(e.target.checked)} 
          />
        </div>
        <div className="flex-1">
          <div className="font-bold text-gray-800 flex items-center gap-2">
            {React.cloneElement(icon, {className: `w-5 h-5 ${checked ? 'text-indigo-600' : 'text-gray-500'}`})}
            {label}
          </div>
          <p className="text-sm text-gray-500 mt-1.5 leading-relaxed">{description}</p>
        </div>
      </label>
    );

    // 結果表示の共通枠コンポーネント
    const ResultSection = ({ title, icon, onCopy, children }) => (
      <div className="bg-white rounded-xl shadow-sm border border-indigo-100 overflow-hidden">
        <div className="bg-indigo-50/40 px-5 py-4 border-b border-indigo-100 flex justify-between items-center">
          <span className="font-bold text-indigo-900 flex items-center gap-2">
            {React.cloneElement(icon, {className: 'w-5 h-5'})}
            {title}
          </span>
          <button 
            onClick={onCopy}
            className="text-indigo-600 hover:text-indigo-800 text-sm font-bold flex items-center gap-1.5 px-3 py-1.5 bg-white border border-indigo-200 rounded-lg shadow-sm transition-colors"
          >
            <IconCopy className="w-4 h-4" />この部分だけコピー
          </button>
        </div>
        <div className="p-6 md:p-8">
          {children}
        </div>
      </div>
    );

    // --- SNS誘導テンプレ ＆ Midjourneyプロンプト 共通コンポーネント ---
    function SnsAndImageTemplates({ articleTitle, articleUrl, mainContentText }) {
      const [appName, setAppName] = useState('');
      const [catchCopy, setCatchCopy] = useState('');

      const snsTemplates = [
        {
          label: "パターン① 共感型（寄り添い）",
          text: `「もっと早く知っていれば…」\n\n私も最初は難しくて戸惑っていましたが、あることに気づいてから景色が少し変わりました。\n\nその時の体験と、どなたでもできる小さなコツをnoteにまとめました👇\n\n${articleUrl}`
        },
        {
          label: "パターン② ノウハウ（お裾分け）",
          text: `【${articleTitle}の小さなコツ】\n\n大切なポイントを3つだけ、ここでお裾分けしますね。\n\n1. 〇〇を意識してみる\n2. 〇〇は無理に使わない\n3. 〇〇の時間を大切にする\n\n「具体的な進め方」はnoteに優しくまとめました👇\n\n${articleUrl}`
        },
        {
          label: "パターン③ 問いかけ型（穏やか）",
          text: `ふと振り返ったとき、どちらを選びたいですか？\n\nA：これまで通り、時間をかけて頑張る\nB：〇〇を取り入れて、心にゆとりを持つ\n\nもし「B」に惹かれた方は、ぜひこの記事を覗いてみてください。\n\n具体的なヒントをnoteに書いています👇\n\n${articleUrl}`
        },
        {
          label: "パターン④ 変化（ビフォーアフター）",
          text: `以前：毎日やることに追われて余裕がない…\n今：少しの工夫で、ホッと一息つける時間が増えました。\n\n私が実際に試してよかった「${articleTitle}」の工夫。\nどなたでも始められるように、noteへまとめました👇\n\n${articleUrl}`
        }
      ];

      // 未入力の場合は元の記事タイトルをフォールバックとして使用
      const displayAppName = appName.trim() !== '' ? appName : articleTitle;
      
      // キャッチコピーの有無でテキストの組み立てを変更
      const typographyText = catchCopy.trim() !== '' 
        ? `"${displayAppName}" and "${catchCopy}"` 
        : `"${displayAppName}"`;

      // Midjourneyプロンプト
      const midjourneyPrompt = `A professional Japanese blog header image for an article about "${articleTitle}", dark navy blue gradient background (#1a2e5a to #2a4d9e), glowing abstract icons representing knowledge and productivity, subtle circuit board texture overlay, clean modern UI elements, bold white Japanese typography reading ${typographyText}, gold accent highlights (#e8b830), soft blue glow effects, trustworthy and professional atmosphere, banner format, 8k resolution, highly detailed --ar 1.91:1 --v 6.0`;

      // すべてコピーする処理
      const handleCopyAll = () => {
        const snsText = snsTemplates.map(t => `【${t.label}】\n${t.text}`).join('\n\n------------------------\n\n');
        
        // 生成されたコンテンツ（すべて） + SNSテンプレ + MJプロンプト を合体
        const fullText = `${mainContentText}\n\n━━━━━━━━━━━━━━━━━━━━\n\n■ SNS誘導テンプレ\n\n${snsText}\n\n━━━━━━━━━━━━━━━━━━━━\n\n■ 見出し画像用 Midjourneyプロンプト (V8想定)\n\n${midjourneyPrompt}`;
        
        copyToClipboard(fullText, '生成されたすべての内容を一括コピーしました！');
      };

      return (
        <div className="mt-12 pt-10 border-t-2 border-gray-200 space-y-10">
          
          {/* 一括コピーボタン（最も目立つように配置） */}
          <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 text-center shadow-sm">
            <h3 className="text-lg font-bold text-indigo-900 mb-2">すべての準備が整いました！</h3>
            <p className="text-sm text-indigo-700 mb-6">生成された文章、下記のSNSテンプレ、Midjourneyプロンプトをすべてまとめてコピーできます。</p>
            <button 
              onClick={handleCopyAll}
              className="bg-gray-800 text-white px-8 py-4 rounded-xl inline-flex items-center justify-center gap-3 text-base font-bold hover:bg-gray-900 transition-colors shadow-md border-b-4 border-gray-900 active:border-b-0 active:translate-y-1"
            >
              <IconCopy className="w-6 h-6" /> 全て一括でコピーする（生成文・SNS・画像P）
            </button>
          </div>

          {/* SNSテンプレセクション */}
          <div>
            <div className="mb-6">
              <h4 className="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                <IconSmartphone className="w-6 h-6 text-indigo-600" /> 
                SNSでnoteへ誘導する文面テンプレ
              </h4>
              <p className="text-sm text-gray-500">作成した記事をSNS（X/Twitter等）で告知し、noteへのアクセスを増やすためのテンプレートです。</p>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {snsTemplates.map((t, i) => (
                <div key={i} className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm group hover:border-indigo-300 transition-colors flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded">{t.label}</span>
                    <button 
                      className="text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity text-xs font-medium px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 rounded-lg flex items-center gap-1"
                      onClick={() => copyToClipboard(t.text, 'SNSテンプレをコピーしました！')}
                    >
                      <IconCopy className="w-3 h-3" />個別コピー
                    </button>
                  </div>
                  <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed flex-1 bg-gray-50 p-3 rounded-lg border border-gray-100">
                    {t.text}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Midjourneyプロンプトセクション */}
          <div>
            <div className="mb-4">
              <h4 className="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                <IconImage className="w-6 h-6 text-pink-600" /> 
                🎨 note見出し画像用 Midjourneyプロンプト
              </h4>
              <p className="text-sm text-gray-500">画像に入れたい文字（アプリ名やキャッチコピー）を入力すると、自動でプロンプトに反映されます。</p>
            </div>
            
            <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm mb-4 flex flex-col md:flex-row gap-4">
              <div className="flex-1">
                <label className="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">メインテキスト（タイトル・アプリ名）</label>
                <input
                  type="text"
                  value={appName}
                  onChange={(e) => setAppName(e.target.value)}
                  placeholder={articleTitle}
                  className="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-shadow"
                />
              </div>
              <div className="flex-1">
                <label className="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">サブテキスト（キャッチコピー）</label>
                <input
                  type="text"
                  value={catchCopy}
                  onChange={(e) => setCatchCopy(e.target.value)}
                  placeholder="例：高度匿名化ツール（外部通信ゼロ・全ファイル対応）"
                  className="w-full p-2.5 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition-shadow"
                />
              </div>
            </div>

            <div className="bg-gray-900 rounded-xl p-5 shadow-inner relative group">
              <button 
                className="absolute top-4 right-4 text-gray-300 hover:text-white text-xs font-medium px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg flex items-center gap-1 transition-colors"
                onClick={() => copyToClipboard(midjourneyPrompt, 'プロンプトをコピーしました！')}
              >
                <IconCopy className="w-4 h-4" />個別コピー
              </button>
              <p className="text-gray-300 text-sm font-mono leading-relaxed pr-20 break-all">
                {midjourneyPrompt}
              </p>
            </div>
          </div>

        </div>
      );
    }

    // アプリの起動
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
