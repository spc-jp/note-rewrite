<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Rewrite Supporter</title>
  
  <!-- Tailwind CSS (デザイン用) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (アプリの動作基盤) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel (ブラウザ上でコードを翻訳する機能) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* アニメーション用のカスタムクラス */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: fadeIn 0.5s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <!-- アプリが描画される場所 -->
  <div id="root"></div>

  <!-- アプリのプログラム本体 -->
  <script type="text/babel">
    const { useState } = React;

    // --- アイコンパーツ ---
    const IconPen = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
    const IconFileText = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const IconScissors = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>;
    const IconListPlus = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line><line x1="12" y1="18" x2="18" y2="18"></line><line x1="15" y1="15" x2="15" y2="21"></line></svg>;
    const IconLink = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>;
    const IconLoader = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
    const IconCopy = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconCheckCircle = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconPlus = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
    const IconTrash = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const IconArrowRight = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const IconSmartphone = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
    const IconImage = ({ className }) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>;

    // クリップボードにコピーする共通関数
    const copyToClipboard = (text, message = 'コピーしました！') => {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        alert(message);
      } catch (err) {
        console.error('コピーに失敗しました', err);
        alert('コピーに失敗しました。手動でコピーしてください。');
      }
      document.body.removeChild(textArea);
    };

    function App() {
      const [mainUrl, setMainUrl] = useState('');
      const [isFetching, setIsFetching] = useState(false);
      const [articleData, setArticleData] = useState(null);
      const [activeTab, setActiveTab] = useState('title');

      const handleFetchArticle = () => {
        if (!mainUrl.includes('note.com')) {
          alert('noteのURLを入力してください。（※プロトタイプのためダミーデータを読み込みます）');
          return;
        }
        setIsFetching(true);
        setTimeout(() => {
          setArticleData({
            url: mainUrl,
            title: 'AI活用のコツと明日から使えるプロンプト術',
            content: '今回はAIの活用方法について解説します。AIを使うと業務がとても効率化されます。ぜひ読んでみてください。\n\n第1章：AIに対するマインドセット...\n第2章：最適なツールの選び方...\n第3章：実践的なプロンプトの書き方...',
          });
          setIsFetching(false);
        }, 1200);
      };

      return (
        <div className="min-h-screen bg-gray-50 font-sans text-gray-800 p-6">
          <div className="max-w-5xl mx-auto space-y-8">
            
            {/* ヘッダー＆メインURL入力部 */}
            <div className="text-center space-y-4">
              <h1 className="text-3xl font-bold text-indigo-600 flex items-center justify-center gap-2">
                <IconPen className="w-8 h-8" />
                Note Rewrite Supporter
              </h1>
              <p className="text-gray-500">過去のnote記事URLを貼り付けて、新しいコンテンツに生まれ変わらせましょう。</p>
              
              <div className="max-w-2xl mx-auto bg-white p-2 rounded-full shadow-sm border border-gray-200 flex items-center mt-6">
                <IconLink className="w-5 h-5 text-gray-400 ml-4 mr-2" />
                <input
                  type="text"
                  value={mainUrl}
                  onChange={(e) => setMainUrl(e.target.value)}
                  placeholder="https://note.com/your_account/n/xxxxx"
                  className="flex-1 py-3 px-2 outline-none text-gray-700 bg-transparent"
                  onKeyDown={(e) => e.key === 'Enter' && handleFetchArticle()}
                />
                <button
                  onClick={handleFetchArticle}
                  disabled={isFetching || !mainUrl}
                  className="bg-indigo-600 text-white px-6 py-3 rounded-full font-medium hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex items-center gap-2"
                >
                  {isFetching ? <IconLoader className="w-5 h-5 animate-spin" /> : '記事を読み込む'}
                </button>
              </div>
            </div>

            {/* 記事データが読み込まれたら表示されるアクションエリア */}
            {articleData && (
              <div className="animate-in">
                {/* 読み込んだ記事のプレビュー */}
                <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 mb-8 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-bold text-indigo-500 mb-1">現在選択中の記事</p>
                    <h2 className="text-lg font-bold text-gray-800">{articleData.title}</h2>
                  </div>
                  <a href={articleData.url} target="_blank" rel="noreferrer" className="text-sm text-indigo-600 hover:underline flex items-center gap-1">
                    元記事を確認 <IconArrowRight className="w-4 h-4" />
                  </a>
                </div>

                {/* アクションタブ */}
                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                  <div className="flex border-b border-gray-200 overflow-x-auto">
                    <TabButton icon={<IconPen />} label="タイトル生成" isActive={activeTab === 'title'} onClick={() => setActiveTab('title')} />
                    <TabButton icon={<IconFileText />} label="導入文リライト" isActive={activeTab === 'intro'} onClick={() => setActiveTab('intro')} />
                    <TabButton icon={<IconScissors />} label="シリーズ化 (分割)" isActive={activeTab === 'split'} onClick={() => setActiveTab('split')} />
                    <TabButton icon={<IconListPlus />} label="まとめ記事作成" isActive={activeTab === 'summary'} onClick={() => setActiveTab('summary')} />
                  </div>
                  
                  <div className="p-6 md:p-8 bg-gray-50/50">
                    {activeTab === 'title' && <TitleFeature article={articleData} />}
                    {activeTab === 'intro' && <IntroFeature article={articleData} />}
                    {activeTab === 'split' && <SplitFeature article={articleData} />}
                    {activeTab === 'summary' && <SummaryFeature mainArticle={articleData} />}
                  </div>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // タブボタンコンポーネント
    const TabButton = ({ icon, label, isActive, onClick }) => (
      <button
        onClick={onClick}
        className={`flex-1 flex items-center justify-center gap-2 py-4 px-6 text-sm font-medium transition-colors whitespace-nowrap ${
          isActive 
            ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/30' 
            : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
        }`}
      >
        {React.cloneElement(icon, { className: 'w-4 h-4' })}
        {label}
      </button>
    );

    // --- SNS誘導テンプレ ＆ Midjourneyプロンプト 共通コンポーネント ---
    function SnsAndImageTemplates({ articleTitle, articleUrl, mainContentText, mainContentLabel }) {
      const snsTemplates = [
        {
          label: "パターン① 共感型（鉄板）",
          text: `「正直これ知らないと損します…」\n\n私も以前は同じように悩んでいましたが、あることに気づいてから劇的に変わりました。\n\nその体験ストーリーと具体的な手順をnoteにまとめました👇\n\n${articleUrl}`
        },
        {
          label: "パターン② ノウハウ切り出し",
          text: `【${articleTitle}のコツ】\n\n大事なポイントを3つだけ無料で公開します！\n\n1. 〇〇を意識する\n2. 〇〇は使わない\n3. 〇〇の時間を決める\n\n「残りの具体的なステップ」はnoteにまとめました👇\n\n${articleUrl}`
        },
        {
          label: "パターン③ 問いかけ型",
          text: `突然ですが、これ、どっち選びますか？\n\nA：今のまま時間をかけ続ける\nB：〇〇を使って自動化する\n\nもし「B」を選んだ方は、ぜひこの記事を読んでみてください。\n\n答えと具体的な実践方法→noteへ誘導👇\n\n${articleUrl}`
        },
        {
          label: "パターン④ ビフォーアフター",
          text: `Before：毎日作業に追われて時間がない…\nAfter：作業時間が半分になり、成果もアップ！\n\n私が実際にやって効果があった「${articleTitle}」のコツ。\nやったこと全部まとめました👇\n\n${articleUrl}`
        }
      ];

      // Midjourneyプロンプト（記事タイトルや内容からAIが最適な色と構成を考えた想定）
      // noteの推奨見出し画像サイズ（1280×670）に合わせて --ar 1.91:1 を付与
      const midjourneyPrompt = `A professional Japanese blog header image for an article about "${articleTitle}", dark navy blue gradient background (#1a2e5a to #2a4d9e), glowing abstract icons representing knowledge and productivity, subtle circuit board texture overlay, clean modern UI elements, bold white Japanese typography reading "${articleTitle}", gold accent highlights (#e8b830), soft blue glow effects, trustworthy and professional atmosphere, banner format, 8k resolution, highly detailed --ar 1.91:1 --v 6.0`;

      // すべてコピーする処理
      const handleCopyAll = () => {
        const snsText = snsTemplates.map(t => `【${t.label}】\n${t.text}`).join('\n\n------------------------\n\n');
        
        const fullText = `■ ${mainContentLabel}\n\n${mainContentText}\n\n━━━━━━━━━━━━━━━━━━━━\n\n■ SNS誘導テンプレ\n\n${snsText}\n\n━━━━━━━━━━━━━━━━━━━━\n\n■ 見出し画像用 Midjourneyプロンプト (V8想定)\n\n${midjourneyPrompt}`;
        
        copyToClipboard(fullText, '生成文、SNSテンプレ、MJプロンプトをすべてコピーしました！');
      };

      return (
        <div className="mt-10 pt-8 border-t border-gray-200 animate-in space-y-10">
          
          {/* SNSテンプレセクション */}
          <div>
            <div className="flex flex-col md:flex-row md:justify-between md:items-end gap-4 mb-6">
              <div>
                <h4 className="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                  <IconSmartphone className="w-6 h-6 text-indigo-600" /> 
                  SNSでnoteへ誘導する文面テンプレ
                </h4>
                <p className="text-sm text-gray-500">作成した記事をSNS（X/Twitter等）で告知し、noteへのアクセスを増やすためのテンプレートです。</p>
              </div>
              
              {/* すべてコピーボタン（最も目立つように配置） */}
              <button 
                onClick={handleCopyAll}
                className="bg-gray-800 text-white px-5 py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold hover:bg-gray-900 transition-colors shadow-md whitespace-nowrap flex-shrink-0 border-b-4 border-gray-900 active:border-b-0 active:translate-y-1"
              >
                <IconCopy className="w-5 h-5" /> 全て一括でコピーする（生成文・SNS・画像P）
              </button>
            </div>
            
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {snsTemplates.map((t, i) => (
                <div key={i} className="bg-white border border-gray-200 rounded-xl p-5 shadow-sm group hover:border-indigo-300 transition-colors flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded">{t.label}</span>
                    <button 
                      className="text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity text-xs font-medium px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 rounded-lg flex items-center gap-1"
                      onClick={() => copyToClipboard(t.text)}
                    >
                      <IconCopy className="w-3 h-3" />個別コピー
                    </button>
                  </div>
                  <div className="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed flex-1 bg-gray-50 p-3 rounded-lg border border-gray-100">
                    {t.text}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Midjourneyプロンプトセクション */}
          <div>
            <div className="mb-4">
              <h4 className="text-xl font-bold text-gray-800 flex items-center gap-2 mb-1">
                <IconImage className="w-6 h-6 text-pink-600" /> 
                🎨 note見出し画像用 Midjourneyプロンプト
              </h4>
              <p className="text-sm text-gray-500">記事の内容からAIが最適なカラーや世界観を推測し、リッチな見出し画像（1.91:1）を生成するための英語プロンプトです。</p>
            </div>
            
            <div className="bg-gray-900 rounded-xl p-5 shadow-inner relative group">
              <button 
                className="absolute top-4 right-4 text-gray-300 hover:text-white text-xs font-medium px-3 py-1.5 bg-gray-800 hover:bg-gray-700 rounded-lg flex items-center gap-1 transition-colors"
                onClick={() => copyToClipboard(midjourneyPrompt)}
              >
                <IconCopy className="w-4 h-4" />コピー
              </button>
              <p className="text-gray-300 text-sm font-mono leading-relaxed pr-20 break-all">
                {midjourneyPrompt}
              </p>
            </div>
          </div>

        </div>
      );
    }

    // --- 各機能コンポーネント ---

    function TitleFeature({ article }) {
      const [isGenerating, setIsGenerating] = useState(false);
      const [results, setResults] = useState([]);

      const handleGenerate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          setResults([
            `90日で売上が変わった！${article.title}の全貌`,
            `【保存版】初心者でも絶対に失敗しないAI活用のステップ`,
            `プロがこっそり教える、本当は教えたくない${article.title}`,
            `なぜあなたのAI活用は上手くいかないのか？原因と対策`,
          ]);
          setIsGenerating(false);
        }, 1500);
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto animate-in">
          <div className="max-w-2xl mx-auto text-center mb-6">
            <h3 className="text-xl font-bold text-gray-800 mb-2">クリック率を高めるタイトル生成</h3>
            <p className="text-gray-500 text-sm">元のタイトルや内容を分析し、より魅力的なタイトル案を複数提案します。</p>
          </div>

          <button
            onClick={handleGenerate}
            disabled={isGenerating}
            className="w-full max-w-2xl mx-auto bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex justify-center items-center gap-2 shadow-sm"
          >
            {isGenerating ? <IconLoader className="w-5 h-5 animate-spin" /> : <IconPen className="w-5 h-5" />}
            タイトル案を生成する
          </button>

          {results.length > 0 && (
            <>
              <div className="space-y-3 pt-4 animate-in max-w-2xl mx-auto">
                {results.map((title, i) => (
                  <div key={i} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex justify-between items-center group hover:border-indigo-300 transition-colors">
                    <span className="text-gray-800 font-medium">{title}</span>
                    <button 
                      className="text-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity text-sm font-medium px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 rounded-lg flex items-center gap-1"
                      onClick={() => copyToClipboard(title)}
                    >
                      <IconCopy className="w-4 h-4" />個別コピー
                    </button>
                  </div>
                ))}
              </div>
              
              {/* SNS告知文面＆画像P 提案（一括コピー情報渡し） */}
              <SnsAndImageTemplates 
                articleTitle={results[0]} 
                articleUrl={article.url}
                mainContentLabel="生成されたタイトル案"
                mainContentText={results.join('\n')}
              />
            </>
          )}
        </div>
      );
    }

    function IntroFeature({ article }) {
      const [isGenerating, setIsGenerating] = useState(false);
      const [result, setResult] = useState('');

      const handleGenerate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          setResult(`## はじめに\n「AIが便利だと聞くけれど、具体的にどう仕事に使えばいいかわからない…」「ChatGPTを少し触ってみたけど、結局いつものやり方に戻ってしまった」\nそんなお悩みはありませんか？\n\n私も最初は同じように悩み、手探りで色々なAIツールを触る日々でした。しかし、AI活用の"あるコツ"に気づいてからは、毎日の単純作業にかかる時間が半分以下になり、本来やるべき仕事に集中できるようになりました。\n\n## この記事でわかること\n実は、AIを使いこなすために難しいITの知識は一切必要ありません。必要なのは、AIに対する「正しい指示の出し方（型）」を知ることだけです。\n\n### 読むメリット\n本記事では、私が実際の業務で試行錯誤して見つけた「明日からすぐに使える具体的なAI活用ステップ」を、初心者の方にもわかりやすく解説します。\n\nこの記事を最後まで読めば、あなたのAIに対する苦手意識がなくなり、明日から強力なアシスタントとして使いこなせるようになるはずです！\n\n---\n▼ 本編はこちらからお読みいただけます\n${article.url}`);
          setIsGenerating(false);
        }, 1500);
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto animate-in">
          <div className="max-w-2xl mx-auto text-center mb-6">
            <h3 className="text-xl font-bold text-gray-800 mb-2">導入文リライト（別記事化）</h3>
            <p className="text-gray-500 text-sm">導入文を変えるだけで「新しい記事」として再投稿できます。noteの目次用に「##」を付けて出力します。</p>
          </div>

          <button
            onClick={handleGenerate}
            disabled={isGenerating}
            className="w-full max-w-2xl mx-auto bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex justify-center items-center gap-2 shadow-sm"
          >
            {isGenerating ? <IconLoader className="w-5 h-5 animate-spin" /> : <IconFileText className="w-5 h-5" />}
            新しい導入文を生成する
          </button>

          {result && (
            <>
              <div className="bg-white max-w-2xl mx-auto rounded-xl shadow-sm border border-indigo-200 overflow-hidden animate-in">
                <div className="bg-indigo-50/50 px-4 py-3 border-b border-indigo-100 flex justify-between items-center">
                  <span className="font-medium text-indigo-900 flex items-center gap-1"><IconCheckCircle className="w-4 h-4 text-green-600"/>生成完了</span>
                  <button 
                    onClick={() => copyToClipboard(result)}
                    className="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 px-3 py-1.5 bg-white border border-indigo-200 rounded-lg shadow-sm transition-colors"
                  >
                    <IconCopy className="w-4 h-4" />個別コピー
                  </button>
                </div>
                <div className="p-6 whitespace-pre-wrap text-gray-700 font-medium leading-relaxed max-h-[400px] overflow-y-auto">
                  {result}
                </div>
              </div>

              {/* SNS告知文面＆画像P 提案（一括コピー情報渡し） */}
              <SnsAndImageTemplates 
                articleTitle={article.title} 
                articleUrl={article.url}
                mainContentLabel="生成された導入文"
                mainContentText={result}
              />
            </>
          )}
        </div>
      );
    }

    function SplitFeature({ article }) {
      const [isGenerating, setIsGenerating] = useState(false);
      const [results, setResults] = useState([]);

      const handleGenerate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          setResults([
            { day: '第1回', title: 'マインドセット編：AIを恐れない', desc: 'なぜ今AIを使うべきなのか、意識の変え方について。' },
            { day: '第2回', title: 'ツール選定編：初心者に最適なAI', desc: 'ChatGPT、Claudeなどツールの選び方と初期設定。' },
            { day: '第3回', title: '実践編：売上を上げるプロンプト術', desc: '実際に業務で使える具体的な指示文（プロンプト）の書き方。' },
          ]);
          setIsGenerating(false);
        }, 2000);
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto animate-in">
          <div className="max-w-2xl mx-auto text-center mb-6">
            <h3 className="text-xl font-bold text-gray-800 mb-2">長文記事のシリーズ化（分割）</h3>
            <p className="text-gray-500 text-sm">長すぎる記事をAIが意味の区切りで分割し、数日間の「連載企画」として再構成します。</p>
          </div>

          <button
            onClick={handleGenerate}
            disabled={isGenerating}
            className="w-full max-w-2xl mx-auto bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex justify-center items-center gap-2 shadow-sm"
          >
            {isGenerating ? <IconLoader className="w-5 h-5 animate-spin" /> : <IconScissors className="w-5 h-5" />}
            記事を3分割して連載にする
          </button>

          {results.length > 0 && (
            <>
              <div className="space-y-4 animate-in">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {results.map((item, i) => (
                    <div key={i} className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm relative overflow-hidden group hover:border-indigo-300 transition-all">
                      <div className="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                      <span className="inline-block px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded mb-3">{item.day}</span>
                      <h4 className="font-bold text-gray-800 mb-2 leading-tight">{item.title}</h4>
                      <p className="text-sm text-gray-600">{item.desc}</p>
                    </div>
                  ))}
                </div>
              </div>

              {/* SNS告知文面＆画像P 提案（一括コピー情報渡し） */}
              <SnsAndImageTemplates 
                articleTitle={`連載：${results[0].title}`} 
                articleUrl={article.url}
                mainContentLabel="生成されたシリーズ構成案"
                mainContentText={results.map(r => `【${r.day}】${r.title}\n${r.desc}`).join('\n\n')}
              />
            </>
          )}
        </div>
      );
    }

    function SummaryFeature({ mainArticle }) {
      const [urls, setUrls] = useState([
        { id: 1, url: mainArticle.url, title: mainArticle.title }
      ]);
      const [newUrl, setNewUrl] = useState('');
      const [isGenerating, setIsGenerating] = useState(false);
      const [result, setResult] = useState('');

      const handleAddUrl = () => {
        if (!newUrl.includes('note.com')) return;
        setUrls([...urls, { id: Date.now(), url: newUrl, title: '（URLから自動取得したタイトル）' }]);
        setNewUrl('');
      };

      const handleRemoveUrl = (id) => {
        setUrls(urls.filter(u => u.id !== id));
      };

      const handleGenerate = () => {
        setIsGenerating(true);
        setTimeout(() => {
          let draft = "## はじめに\n「これから情報発信を始めたいけれど、何から読めばいいかわからない」\nそんな方のために、過去の記事の中から特に重要なものを厳選してまとめました。\n\n## おすすめ記事まとめ\n\n";
          
          urls.forEach((u, i) => {
            draft += `### ${i + 1}. ${u.title}\n`;
            draft += `この記事では、具体的なノウハウや考え方について詳しく解説しています。まずはここから読むのがおすすめです。\n`;
            draft += `${u.url}\n\n`;
          });
          
          draft += "## おわりに\nいかがでしたか？これらの記事を読んで、ぜひ実践してみてください！";
          setResult(draft);
          setIsGenerating(false);
        }, 1500);
      };

      return (
        <div className="space-y-6 max-w-4xl mx-auto animate-in">
          <div className="max-w-2xl mx-auto text-center mb-6">
            <h3 className="text-xl font-bold text-gray-800 mb-2">回遊率を上げる「まとめ記事」作成</h3>
            <p className="text-gray-500 text-sm">まとめたい記事のURLを追加していくだけで、内部リンク付きのまとめ記事を自動生成します。</p>
          </div>

          <div className="bg-white max-w-2xl mx-auto p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
            <h4 className="font-medium text-gray-700">まとめる記事リスト ({urls.length}件)</h4>
            
            <div className="space-y-2">
              {urls.map((u, i) => (
                <div key={u.id} className="flex items-center gap-3 p-3 bg-gray-50 border border-gray-200 rounded-lg">
                  <span className="flex-shrink-0 w-6 h-6 bg-gray-200 text-gray-600 rounded-full flex items-center justify-center text-xs font-bold">{i + 1}</span>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-medium text-gray-800 truncate">{u.title}</p>
                    <p className="text-xs text-gray-400 truncate">{u.url}</p>
                  </div>
                  {i !== 0 && (
                    <button onClick={() => handleRemoveUrl(u.id)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                      <IconTrash className="w-4 h-4" />
                    </button>
                  )}
                </div>
              ))}
            </div>

            <div className="flex gap-2 pt-2">
              <input
                type="text"
                value={newUrl}
                onChange={(e) => setNewUrl(e.target.value)}
                placeholder="追加するnoteのURLを貼り付け"
                className="flex-1 p-3 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                onKeyDown={(e) => e.key === 'Enter' && handleAddUrl()}
              />
              <button 
                onClick={handleAddUrl}
                disabled={!newUrl.includes('note.com')}
                className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 font-medium whitespace-nowrap disabled:opacity-50 flex items-center gap-1"
              >
                <IconPlus className="w-4 h-4" />追加
              </button>
            </div>
          </div>

          <button
            onClick={handleGenerate}
            disabled={isGenerating || urls.length === 0}
            className="w-full max-w-2xl mx-auto bg-indigo-600 text-white font-medium py-3 rounded-xl hover:bg-indigo-700 transition-colors disabled:bg-indigo-300 flex justify-center items-center gap-2 shadow-sm"
          >
            {isGenerating ? <IconLoader className="w-5 h-5 animate-spin" /> : <IconListPlus className="w-5 h-5" />}
            このリストでまとめ記事の下書きを生成
          </button>

          {result && (
            <>
              <div className="bg-white max-w-2xl mx-auto rounded-xl shadow-sm border border-indigo-200 overflow-hidden animate-in">
                <div className="bg-indigo-50/50 px-4 py-3 border-b border-indigo-100 flex justify-between items-center">
                  <span className="font-medium text-indigo-900 flex items-center gap-1"><IconCheckCircle className="w-4 h-4 text-green-600"/>生成完了</span>
                  <button 
                    onClick={() => copyToClipboard(result)}
                    className="text-indigo-600 hover:text-indigo-800 text-sm font-medium flex items-center gap-1 px-3 py-1.5 bg-white border border-indigo-200 rounded-lg shadow-sm transition-colors"
                  >
                    <IconCopy className="w-4 h-4" />個別コピー
                  </button>
                </div>
                <div className="p-6 whitespace-pre-wrap text-gray-700 font-medium leading-relaxed">
                  {result}
                </div>
              </div>

              {/* SNS告知文面＆画像P 提案（一括コピー情報渡し） */}
              <SnsAndImageTemplates 
                articleTitle="おすすめ記事まとめ" 
                articleUrl={urls[0].url}
                mainContentLabel="生成されたまとめ記事"
                mainContentText={result}
              />
            </>
          )}
        </div>
      );
    }

    // アプリの起動
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
